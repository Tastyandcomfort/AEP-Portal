  <!-- ===================================================
       DUAL-ENGINE AUTO-MAPPER JAVASCRIPT CONTROLLER
       =================================================== -->
  <script>
    const GOOGLE_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby-YOUR-DEPLOYED-URL-HERE/exec";

    let blankPdfBytes = null;
    let photoBytes = null;
    let activePdfUrl = null;
    let debounceTimer = null;

    function getVal(id) {
      const el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }

    function isChecked(id) {
      const el = document.getElementById(id);
      return el ? el.checked : false;
    }

    function debounceRefresh() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(refreshPdfPreview, 350);
    }

    // Fetches the PDF with drawn boxes from your repo root
    async function loadBlankPdf() {
      if (blankPdfBytes) return blankPdfBytes;

      const candidates = [
        'bcas_aepaf_blank.pdf',
        './bcas_aepaf_blank.pdf',
        'bcas_aepaf_fillable.pdf',
        './bcas_aepaf_fillable.pdf'
      ];

      for (let path of candidates) {
        try {
          const res = await fetch(`${path}?t=${Date.now()}`);
          if (res.ok) {
            const buf = await res.arrayBuffer();
            if (buf.byteLength > 1000) {
              blankPdfBytes = new Uint8Array(buf);
              return blankPdfBytes;
            }
          }
        } catch (e) {}
      }
      return null;
    }

    function handlePhotoUpload(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          photoBytes = new Uint8Array(e.target.result);
          refreshPdfPreview();
        };
        reader.readAsArrayBuffer(input.files[0]);
      }
    }

    function collectData() {
      const zones = [];
      ['A', 'D', 'T', 'Si', 'Sd', 'P', 'B', 'F'].forEach(z => {
        if (isChecked(`zone_${z}`)) zones.push(z);
      });

      return {
        refId: getVal('f_refId'),
        type: getVal('f_type'),
        category: getVal('f_category'),
        zones: zones,
        airport: getVal('f_airport').toUpperCase(),
        issueCat: getVal('f_issueCat'),
        name: getVal('f_name').toUpperCase(),
        father: getVal('f_father').toUpperCase(),
        mother: getVal('f_mother').toUpperCase(),
        dob: getVal('f_dob'),
        blood: getVal('f_blood').toUpperCase(),
        gender: getVal('f_gender'),
        mobile: getVal('f_mobile'),
        email: getVal('f_email').toUpperCase(),
        kin: getVal('f_kin'),
        aadhaar: getVal('f_aadhaar'),
        idType: getVal('f_idType').toUpperCase(),
        permStreet: getVal('f_permStreet').toUpperCase(),
        permDist: getVal('f_permDist').toUpperCase(),
        permState: getVal('f_permState').toUpperCase(),
        permPin: getVal('f_permPin'),
        permProof: getVal('f_permProof').toUpperCase(),
        presStreet: getVal('f_presStreet').toUpperCase(),
        presDist: getVal('f_presDist').toUpperCase(),
        presState: getVal('f_presState').toUpperCase(),
        presPin: getVal('f_presPin'),
        org: getVal('f_org').toUpperCase(),
        desig: getVal('f_desig').toUpperCase(),
        empNo: getVal('f_empno').toUpperCase(),
        dutyPlace: getVal('f_dutyPlace').toUpperCase(),
        nature: getVal('f_nature').toUpperCase(),
        officeAddr: getVal('f_officeAddr').toUpperCase(),
        avsecDate: getVal('f_avsecDate'),
        avsecLoc: getVal('f_avsecLoc').toUpperCase(),
        avsecInst: getVal('f_avsecInst').toUpperCase(),
        pvcId: getVal('f_pvcId').toUpperCase(),
        pvcDate: getVal('f_pvcDate')
      };
    }

    // Precise checkmark vector drawer
    function drawCheck(page, x, y) {
      const { rgb } = PDFLib;
      page.drawLine({ start: { x: x, y: y + 2 }, end: { x: x + 2.5, y: y }, thickness: 1.5, color: rgb(0,0,0) });
      page.drawLine({ start: { x: x + 2.5, y: y }, end: { x: x + 6.5, y: y + 6 }, thickness: 1.5, color: rgb(0,0,0) });
    }

    // MAIN DUAL-ENGINE PROCESSOR
    async function buildOfficialStampedPdfBlob() {
      if (typeof PDFLib === 'undefined') {
        throw new Error("PDFLib library is loading or blocked. Please wait a moment.");
      }

      const bytes = await loadBlankPdf();
      if (!bytes) {
        throw new Error("Could not find 'bcas_aepaf_blank.pdf' in your repository.");
      }

      const { PDFDocument, rgb, StandardFonts } = PDFLib;
      const data = collectData();

      const pdfDoc = await PDFDocument.load(bytes);
      const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
      const fontNorm = await pdfDoc.embedFont(StandardFonts.Helvetica);

      // Check if interactive AcroForm fields exist
      let formFieldsFilled = false;
      try {
        const form = pdfDoc.getForm();
        const fields = form.getFields();

        if (fields.length > 5) {
          // ENGINE 1: Spatial Auto-Detection of AcroForm Fields based on widget positions
          fields.forEach(field => {
            const widgets = field.acroField.getWidgets();
            if (!widgets || widgets.length === 0) return;
            const rect = widgets[0].getRectangle();
            const y = rect.y;
            const x = rect.x;
            const type = field.constructor.name;

            if (type.includes('Text')) {
              // Page 1 Spatial Checks
              if (y > 660 && y < 700) field.setText(data.refId);
              else if (y > 220 && y < 245 && x < 350) field.setText(data.name);
              else if (y > 220 && y < 245 && x >= 350) field.setText(data.aadhaar);
              else if (y > 200 && y <= 220 && x < 350) field.setText(data.father);
              else if (y > 200 && y <= 220 && x >= 350) field.setText(data.mother);
              else if (y > 185 && y <= 200 && x < 350) field.setText(data.dob);
              else if (y > 185 && y <= 200 && x >= 350) field.setText(data.blood);
              else if (y > 170 && y <= 185 && x < 350) field.setText(data.mobile);
              else if (y > 170 && y <= 185 && x >= 350) field.setText(data.email);
              else if (y > 155 && y <= 170 && x < 350) field.setText(data.kin);
              else if (y > 155 && y <= 170 && x >= 350) field.setText(data.idType);
              else if (y > 125 && y <= 150 && x < 200) field.setText("NIL");
              else if (y > 125 && y <= 150 && x >= 200 && x < 400) field.setText("NIL");
              else if (y > 125 && y <= 150 && x >= 400) field.setText("HYD");
              // Addresses
              else if (y > 85 && y <= 110 && x < 300) field.setText(data.permStreet);
              else if (y > 70 && y <= 85 && x < 300) field.setText(data.permDist);
              else if (y > 55 && y <= 70 && x < 300) field.setText(data.permState);
              else if (y > 40 && y <= 55 && x < 300) field.setText(data.permPin);
              else if (y > 25 && y <= 40 && x < 300) field.setText(data.permProof);
              else if (y > 85 && y <= 110 && x >= 300) field.setText(data.presStreet);
              else if (y > 70 && y <= 85 && x >= 300) field.setText(data.presDist);
              else if (y > 55 && y <= 70 && x >= 300) field.setText(data.presState);
              else if (y > 40 && y <= 55 && x >= 300) field.setText(data.presPin);
              // Page 2 Spatial Checks
              else if (y > 740 && y < 770 && x < 300) field.setText(data.org);
              else if (y > 740 && y < 770 && x >= 300) field.setText(data.desig);
              else if (y > 720 && y <= 740 && x < 300) field.setText(data.empNo);
              else if (y > 720 && y <= 740 && x >= 300) field.setText(data.dutyPlace);
              else if (y > 700 && y <= 720 && x < 300) field.setText(data.nature);
              else if (y > 700 && y <= 720 && x >= 300) field.setText("26/09/2053");
              else if (y > 675 && y <= 700) field.setText(data.officeAddr);
              else if (y > 360 && y < 400 && x < 300) field.setText(data.avsecDate);
              else if (y > 360 && y < 400 && x >= 300) field.setText(data.avsecLoc);
              else if (y > 325 && y <= 360) field.setText(data.avsecInst);
              else if (y > 260 && y < 300) field.setText(`Certificate No: ${data.pvcId} | Date: ${data.pvcDate} | Status: CLEARED`);
            } else if (type.includes('Check')) {
              // Checkboxes based on Y bands
              if (y > 630 && y < 650 && x < 250) field.check(); // Permanent
              else if (y > 580 && y < 605 && x < 250) field.check(); // Operational
              else if (y > 520 && y < 545 && x < 200 && data.zones.includes('A')) field.check();
              else if (y > 520 && y < 545 && x >= 200 && x < 270 && data.zones.includes('D')) field.check();
              else if (y > 520 && y < 545 && x >= 270 && x < 340 && data.zones.includes('T')) field.check();
              else if (y > 470 && y < 500 && x < 200) field.check(); // Single Airport
              else if (y > 370 && y < 400 && x < 250) field.check(); // All Terminals
              else if (y > 350 && y < 370 && x > 350) field.check(); // Fresh
              else if (y > 330 && y < 350 && x < 250) field.check(); // Appointment Order
              else if (y > 240 && y < 265 && x < 250 && data.gender === 'Male') field.check();
              // Page 2 Checks (No boxes in Sec 7)
              else if (y > 650 && y < 680 && x > 400) field.check();
              else if (y > 610 && y < 640 && x > 400) field.check();
              else if (y > 575 && y < 605 && x > 400) field.check();
              else if (y > 545 && y < 575 && x > 250) field.check();
            }
          });
          formFieldsFilled = true;
        }
      } catch (e) {
        formFieldsFilled = false;
      }

      const pages = pdfDoc.getPages();
      const page1 = pages[0];
      const page2 = pages[1] || page1;

      // ENGINE 2: PRECISION FALLBACK DIRECT STAMPING (If fields weren't interactive)
      if (!formFieldsFilled) {
        // Page 1 Stamping
        page1.drawText(data.refId, { x: 220, y: 674, size: 8.5, font });

        if (data.type === 'Permanent') drawCheck(page1, 171, 640);
        if (data.type.includes('Temporary')) drawCheck(page1, 393, 640);

        if (data.category === 'Operational') drawCheck(page1, 171, 591);
        if (data.category === 'Protocol') drawCheck(page1, 171, 573);

        if (data.zones.includes('A')) drawCheck(page1, 171, 530);
        if (data.zones.includes('D')) drawCheck(page1, 246, 530);
        if (data.zones.includes('T')) drawCheck(page1, 318, 530);
        if (data.zones.includes('Si')) drawCheck(page1, 393, 530);
        if (data.zones.includes('Sd')) drawCheck(page1, 458, 530);
        if (data.zones.includes('P')) drawCheck(page1, 526, 530);
        if (data.zones.includes('B')) drawCheck(page1, 171, 511);
        if (data.zones.includes('F')) drawCheck(page1, 246, 511);

        drawCheck(page1, 171, 485);
        page1.drawText(data.airport, { x: 285, y: 485, size: 8, font });

        drawCheck(page1, 203, 378); // All terminals
        drawCheck(page1, 393, 360); // Fresh
        drawCheck(page1, 171, 336); // Appointment

        if (data.gender === 'Male') drawCheck(page1, 203, 250);
        if (data.gender === 'Female') drawCheck(page1, 267, 250);

        page1.drawText(data.name, { x: 154, y: 230, size: 7.5, font });
        page1.drawText(data.aadhaar, { x: 424, y: 230, size: 7.5, font });

        page1.drawText(data.father, { x: 154, y: 213, size: 7.5, font });
        page1.drawText(data.mother, { x: 424, y: 213, size: 7.5, font });

        page1.drawText(data.dob, { x: 154, y: 196, size: 7.5, font });
        page1.drawText(data.blood, { x: 424, y: 196, size: 7.5, font });
        page1.drawText(data.gender.toUpperCase(), { x: 480, y: 196, size: 7.5, font });

        page1.drawText(data.mobile, { x: 154, y: 179, size: 7.5, font });
        page1.drawText(data.email, { x: 424, y: 179, size: 6.8, font });

        page1.drawText(data.kin, { x: 154, y: 162, size: 7.5, font });
        page1.drawText(data.idType, { x: 424, y: 162, size: 7.2, font });

        page1.drawText("NIL", { x: 75, y: 137, size: 7.5, font: fontNorm });
        page1.drawText("NIL", { x: 320, y: 137, size: 7.5, font: fontNorm });
        page1.drawText("HYD", { x: 480, y: 137, size: 7.5, font: fontNorm });

        page1.drawText(data.permStreet, { x: 154, y: 98, size: 6.8, font: fontNorm });
        page1.drawText(data.permDist, { x: 154, y: 82, size: 6.8, font: fontNorm });
        page1.drawText(data.permState, { x: 154, y: 66, size: 6.8, font: fontNorm });
        page1.drawText(data.permPin, { x: 154, y: 50, size: 6.8, font: fontNorm });
        page1.drawText(data.permProof, { x: 185, y: 34, size: 6.8, font });

        page1.drawText(data.presStreet, { x: 424, y: 98, size: 6.8, font: fontNorm });
        page1.drawText(data.presDist, { x: 424, y: 82, size: 6.8, font: fontNorm });
        page1.drawText(data.presState, { x: 424, y: 66, size: 6.8, font: fontNorm });
        page1.drawText(data.presPin, { x: 424, y: 50, size: 6.8, font: fontNorm });

        // Page 2 Stamping
        page1.drawText("", { x: 0, y: 0, size: 1, font });
        page2.drawText(data.org, { x: 154, y: 748, size: 7.8, font });
        page2.drawText(data.desig, { x: 432, y: 748, size: 7.8, font });

        page2.drawText(data.empNo, { x: 154, y: 729, size: 8, font });
        page2.drawText(data.dutyPlace, { x: 432, y: 729, size: 7.8, font });

        page2.drawText(data.nature, { x: 154, y: 710, size: 7.8, font });
        page2.drawText("26/09/2053", { x: 432, y: 710, size: 7.8, font });

        page2.drawText(data.officeAddr, { x: 154, y: 690, size: 6.2, font: fontNorm });

        drawCheck(page2, 435, 665);
        drawCheck(page2, 435, 628);
        drawCheck(page2, 435, 591);
        drawCheck(page2, 288, 556);

        drawCheck(page2, 118, 517);
        drawCheck(page2, 190, 517);
        drawCheck(page2, 258, 517);

        page2.drawText("INDIAN NATIONAL (NOT APPLICABLE)", { x: 150, y: 418, size: 7.2, font });

        page2.drawText(data.avsecDate, { x: 154, y: 375, size: 7.8, font });
        page2.drawText(data.avsecLoc, { x: 398, y: 375, size: 7.8, font });
        drawCheck(page2, 73, 357);
        page2.drawText(data.avsecInst, { x: 265, y: 336, size: 7.2, font });

        page2.drawText(`Certificate No: ${data.pvcId} | Date: ${data.pvcDate} | Status: CLEARED & APPROVED`, { x: 160, y: 278, size: 7.5, font });

        page2.drawText("HYD", { x: 92, y: 165, size: 8, font });
        page2.drawText("04/11/2026", { x: 92, y: 144, size: 7.5, font });
        page2.drawText(data.org, { x: 360, y: 165, size: 7.2, font });
        page2.drawText("SECURITY DEPT", { x: 410, y: 120, size: 7.2, font });
      }

      // Passport Photograph stamped into the top-right box
      if (photoBytes) {
        try {
          const img = await pdfDoc.embedJpg(photoBytes).catch(async () => await pdfDoc.embedPng(photoBytes));
          page1.drawImage(img, { x: 480, y: 686, width: 98, height: 124 });
        } catch (e) {}
      }

      const stampedBytes = await pdfDoc.save();
      return new Blob([stampedBytes], { type: "application/pdf" });
    }

    async function refreshPdfPreview() {
      try {
        const blob = await buildOfficialStampedPdfBlob();
        if (blob) {
          if (activePdfUrl) URL.revokeObjectURL(activePdfUrl);
          activePdfUrl = URL.createObjectURL(blob);
          document.getElementById('pdf-preview-frame').src = activePdfUrl;
        }
      } catch (err) {
        console.warn("Preview notice:", err.message);
      }
    }

    async function generateAndDownloadOfficialPdf() {
      const btn = document.getElementById('btn-download');
      const originalText = btn.innerHTML;

      try {
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Processing...`;
        btn.disabled = true;

        const blob = await buildOfficialStampedPdfBlob();
        if (!blob) throw new Error("Could not compile PDF blob.");

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        const empNo = getVal('f_empno') || 'AEP';
        a.download = `Filled_BCAS_AEP_Application_${empNo.replace(/\s+/g, '_')}.pdf`;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);
      } catch (err) {
        console.error("Download Error:", err);
        alert(err.message);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function generateAndPrintOfficialPdf() {
      const btn = document.getElementById('btn-print');
      const originalText = btn.innerHTML;

      try {
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Generating...`;
        btn.disabled = true;

        const blob = await buildOfficialStampedPdfBlob();
        if (!blob) throw new Error("Could not compile PDF blob.");

        const url = URL.createObjectURL(blob);
        const win = window.open(url, '_blank');
        if (!win) {
          const a = document.createElement('a');
          a.href = url;
          a.download = `Filled_BCAS_AEP_Application.pdf`;
          a.click();
        }
      } catch (err) {
        console.error("Print Error:", err);
        alert(err.message);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function handleGSheetSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving to Google Sheets...`;

      const data = collectData();

      try {
        if (!GOOGLE_SCRIPT_WEBAPP_URL.includes("https://script.google.com/macros/s/AKfycbw-50wDrmCSvKL--F1jCuZuMuj8x5abEqR69poR-LTkT-_2VAWkeESp3iAGuXi6x9pP/exec")) {
          await fetch(GOOGLE_SCRIPT_WEBAPP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(data)
          });
        }
        alert(`✅ Application for ${data.name} (${data.empNo}) saved to Google Sheets under 'SECURITY'.`);
      } catch (err) {
        alert("Record saved to active session.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const bytes = await loadBlankPdf();
        if (bytes) {
          refreshPdfPreview();
        }
      } catch (e) {
        console.warn("Init notice:", e);
      }
    });
  </script>
</body>
