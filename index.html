<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AEP Official Portal | BCAS Form Engine</title>

  <meta name="theme-color" content="#f5f5f7" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- PDF-Lib Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
    }
    .apple-glass-nav {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .apple-card {
      background: #ffffff;
      border: 1px solid rgba(210, 210, 215, 0.6);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      border-radius: 16px;
    }
    .apple-input {
      background: #fbfbfd;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
    }
    .apple-input:focus {
      outline: none;
      background: #ffffff;
      border-color: #0071e3;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    }
    .pdf-preview-frame {
      width: 100%;
      border-radius: 16px;
      border: 1px solid #d2d2d7;
      background: #525659;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- Navigation Bar -->
  <header class="fixed top-0 left-0 right-0 h-16 apple-glass-nav border-b border-[#d2d2d7]/60 z-50">

        <div class="w-9 h-9 rounded-xl bg-[#0071e3] flex items-center justify-center text-white shadow-xs">
          <i class="fa-solid fa-file-pdf text-sm"></i>
        </div>
        <div>
          <span class="text-sm md:text-base font-semibold tracking-tight block leading-tight">BCAS AEP Form Engine</span>
          <span class="text-[10px] text-[#86868b] tracking-wider uppercase font-semibold">Precision Calibrated Form Mapper</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-2">
        <button type="button" onclick="generateAndPrintOfficialPdf()" id="btn-print" class="px-3 md:px-5 py-2 md:py-2.5 bg-[#1d1d1f] hover:bg-black active:scale-[0.98] text-white text-xs font-bold rounded-xl shadow-md transition-all flex items-center space-x-1.5 cursor-pointer">
          <i class="fa-solid fa-print"></i>
          <span class="hidden sm:inline">Print Filled PDF</span>
        </button>

        <button type="button" onclick="generateAndDownloadOfficialPdf()" id="btn-download" class="px-3 md:px-5 py-2 md:py-2.5 bg-[#0071e3] hover:bg-[#0077ed] active:scale-[0.98] text-white text-xs font-bold rounded-xl shadow-xs transition-all flex items-center space-x-1.5 cursor-pointer">
          <i class="fa-solid fa-download"></i>
          <span class="hidden sm:inline">Download Filled PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 md:px-6 pt-20 md:pt-24 pb-20">

    <div class="grid grid-cols-1 xl:grid-cols-12 gap-8 items-start">

            <div>
              <label class="block text-xs font-semibold text-[#86868b] uppercase mb-1">1. AEP Reference ID *</label>
              <input type="text" id="f_refId" required value="HYD/2026/AEP/72835" oninput="debounceRefresh()" class="w-full p-2.5 apple-input text-xs font-bold uppercase" />
            </div>

            <div class="grid grid-cols-2 gap-3 text-xs">

                <label class="block font-semibold text-[#86868b] uppercase mb-1">2a. Type</label>
                <select id="f_type" onchange="debounceRefresh()" class="w-full p-2.5 apple-input font-medium">

  <script>
    let blankPdfBytes = null;
    let photoBytes = null;
    let activePdfUrl = null;
    let debounceTimer = null;

    function getVal(id) {
      const el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }

    function isChecked(id) {
      const el = document.getElementById(id);
      return el ? el.checked : false;
    }

    function debounceRefresh() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(refreshPdfPreview, 250);
    }

    async function loadBlankPdf() {
      if (blankPdfBytes) return blankPdfBytes;

      const candidates = [
        'bcas_aepaf_blank.pdf',
        './bcas_aepaf_blank.pdf',
        'bcas_aepaf_fillable.pdf',
        './bcas_aepaf_fillable.pdf'
      ];

      for (let path of candidates) {
        try {
          const res = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });
          if (res.ok) {
            const buf = await res.arrayBuffer();
            if (buf.byteLength > 1000) {
              blankPdfBytes = new Uint8Array(buf);
              return blankPdfBytes;
            }
          }
        } catch (e) {}
      }
      return null;
    }

    function handlePhotoUpload(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          photoBytes = new Uint8Array(e.target.result);
          refreshPdfPreview();
        };
        reader.readAsArrayBuffer(input.files[0]);
      }
    }

    function collectData() {
      const zones = [];
      ['A', 'D', 'T', 'Si', 'Sd', 'P', 'B', 'F'].forEach(z => {
        if (isChecked(`zone_${z}`)) zones.push(z);
      });

      return {
        refId: getVal('f_refId'),
        type: getVal('f_type'),
        category: getVal('f_category'),
        zones: zones,
        airport: getVal('f_airport').toUpperCase(),
        issueCat: getVal('f_issueCat'),
        name: getVal('f_name').toUpperCase(),
        father: getVal('f_father').toUpperCase(),
        mother: getVal('f_mother').toUpperCase(),
        dob: getVal('f_dob'),
        blood: getVal('f_blood').toUpperCase(),
        gender: getVal('f_gender').toUpperCase(),
        mobile: getVal('f_mobile'),
        email: getVal('f_email').toUpperCase(),
        kin: getVal('f_kin'),
        aadhaar: getVal('f_aadhaar'),
        idType: getVal('f_idType').toUpperCase(),
        permStreet: getVal('f_permStreet').toUpperCase(),
        permDist: getVal('f_permDist').toUpperCase(),
        permState: getVal('f_permState').toUpperCase(),
        permPin: getVal('f_permPin'),
        permProof: getVal('f_permProof').toUpperCase(),
        presStreet: getVal('f_presStreet').toUpperCase(),
        presDist: getVal('f_presDist').toUpperCase(),
        presState: getVal('f_presState').toUpperCase(),
        presPin: getVal('f_presPin'),
        org: getVal('f_org').toUpperCase(),
        desig: getVal('f_desig').toUpperCase(),
        empNo: getVal('f_empno').toUpperCase(),
        dutyPlace: getVal('f_dutyPlace').toUpperCase(),
        nature: getVal('f_nature').toUpperCase(),
        officeAddr: getVal('f_officeAddr').toUpperCase(),
        avsecDate: getVal('f_avsecDate'),
        avsecLoc: getVal('f_avsecLoc').toUpperCase(),
        avsecInst: getVal('f_avsecInst').toUpperCase(),
        pvcId: getVal('f_pvcId').toUpperCase(),
        pvcDate: getVal('f_pvcDate')
      };
    }

    // Dynamic text fitter: scales down font size so text never exceeds maxW
    function drawFittedText(page, text, x, y, maxW, baseSize, font) {
      if (!text) return;
      let str = String(text).trim();
      let size = baseSize;
      let textW = font.widthOfTextAtSize(str, size);
      while (textW > maxW && size > 4.5) {
        size -= 0.3;
        textW = font.widthOfTextAtSize(str, size);
      }
      if (textW > maxW) {
        while (font.widthOfTextAtSize(str + '...', size) > maxW && str.length > 3) {
          str = str.slice(0, -1);
        }
        str += '...';
      }
      page.drawText(str, { x, y, size, font });
    }

    // Precision Vector Checkmark centered in square boxes
    function drawCheck(page, x, y) {
      const { rgb } = PDFLib;
      page.drawLine({
        start: { x: x + 1.2, y: y + 3.2 },
        end: { x: x + 3.0, y: y + 1.2 },
        thickness: 1.5,
        color: rgb(0, 0, 0)
      });
      page.drawLine({
        start: { x: x + 3.0, y: y + 1.2 },
        end: { x: x + 6.8, y: y + 6.2 },
        thickness: 1.5,
        color: rgb(0, 0, 0)
      });
    }

    async function buildOfficialStampedPdfBlob() {
      if (typeof PDFLib === 'undefined') {
        throw new Error("PDFLib library is loading.");
      }

      const bytes = await loadBlankPdf();
      if (!bytes) {
        throw new Error("Could not find 'bcas_aepaf_blank.pdf' in your repository.");
      }

      const { PDFDocument, StandardFonts, PDFName } = PDFLib;
      const data = collectData();

      const pdfDoc = await PDFDocument.load(bytes);
      const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
      const fontNorm = await pdfDoc.embedFont(StandardFonts.Helvetica);

      // Strip any opaque white annotation overlays
      const pages = pdfDoc.getPages();
      pages.forEach(p => {
        p.node.delete(PDFName.of('Annots'));
      });
      pdfDoc.catalog.delete(PDFName.of('AcroForm'));

      const page1 = pages[0];
      const page2 = pages[1] || page1;

      // ==========================================
      // PAGE 1: TEXT FIELDS (VERTICALLY CENTERED)
      // ==========================================

      // 1. Reference ID
      drawFittedText(page1, data.refId, 218, 693, 200, 8.5, font);

      // 2d. Airport Text
      drawFittedText(page1, data.airport, 280, 494, 90, 7.8, font);

      // 4a. Details of Applicant (Centered in cells)
      // Left Column
      drawFittedText(page1, data.name, 154, 237, 185, 7.5, font);
      drawFittedText(page1, data.father, 154, 219, 185, 7.5, font);
      drawFittedText(page1, data.dob, 154, 201, 110, 7.5, font);
      drawFittedText(page1, data.mobile, 154, 183, 110, 7.5, font);
      drawFittedText(page1, data.kin, 154, 165, 110, 7.5, font);

      // Right Column
      drawFittedText(page1, data.aadhaar, 426, 237, 140, 7.5, font);
      drawFittedText(page1, data.mother, 426, 222, 140, 7.5, font);
      drawFittedText(page1, data.blood, 426, 206, 140, 7.5, font);
      drawFittedText(page1, data.gender, 426, 191, 140, 7.5, font);
      drawFittedText(page1, data.email, 426, 175, 140, 6.8, font);
      drawFittedText(page1, data.idType, 426, 160, 140, 7.2, font);

      // 4b. Existing AEP: Positioned on the line and inside the cell
      drawFittedText(page1, "NIL", 130, 147, 90, 7.5, fontNorm);
      drawFittedText(page1, "NIL", 340, 147, 90, 7.5, fontNorm);
      drawFittedText(page1, "HYD", 505, 147, 75, 7.5, fontNorm);

      // 5. Residential Address: Vertically centered in boxes
      drawFittedText(page1, data.permStreet, 154, 96, 185, 6.8, fontNorm);
      drawFittedText(page1, data.permDist, 154, 78, 185, 6.8, fontNorm);
      drawFittedText(page1, data.permState, 154, 60, 185, 6.8, fontNorm);
      drawFittedText(page1, data.permPin, 154, 42, 185, 6.8, fontNorm);
      drawFittedText(page1, data.permProof, 180, 30, 160, 7.0, font);

      drawFittedText(page1, data.presStreet, 426, 96, 140, 6.8, fontNorm);
      drawFittedText(page1, data.presDist, 426, 78, 140, 6.8, fontNorm);
      drawFittedText(page1, data.presState, 426, 60, 140, 6.8, fontNorm);
      drawFittedText(page1, data.presPin, 426, 42, 140, 6.8, fontNorm);

      // ==========================================
      // PAGE 1: VECTOR CHECKMARKS
      // ==========================================

      // 2a. Type (Col 1 at X = 140, Col 2 at X = 362)
      if (data.type === 'Permanent') drawCheck(page1, 200, 580);
      if (data.type === 'Temporary') drawCheck(page1, 358, 625);
      if (data.type === '1Day') drawCheck(page1, 140, 611);
      if (data.type === '1-7Days') drawCheck(page1, 214, 611);
      if (data.type === '3Months') drawCheck(page1, 288, 611);
      if (data.type === '6Months') drawCheck(page1, 362, 611);

      // 2b. Category (Left column at X = 140, Right at X = 362)
      if (data.category === 'Operational') drawCheck(page1, 140, 584);
      if (data.category === 'GovtSecurity') drawCheck(page1, 362, 584);
      if (data.category === 'Protocol') drawCheck(page1, 140, 566);
      if (data.category === 'Infra') drawCheck(page1, 362, 566);
      if (data.category === 'ForeignNational') drawCheck(page1, 140, 548);
      if (data.category === 'ToolOfTrade') drawCheck(page1, 362, 548);

      // 2c. Operational Zones (Boxes at X = 140, 200, 260, 330, 400, 460)
      if (data.zones.includes('A')) drawCheck(page1, 140, 523);
      if (data.zones.includes('D')) drawCheck(page1, 200, 523);
      if (data.zones.includes('T')) drawCheck(page1, 260, 523);
      if (data.zones.includes('Si')) drawCheck(page1, 330, 523);
      if (data.zones.includes('Sd')) drawCheck(page1, 400, 523);
      if (data.zones.includes('P')) drawCheck(page1, 460, 523);

      if (data.zones.includes('B')) drawCheck(page1, 140, 505);
      if (data.zones.includes('F')) drawCheck(page1, 200, 505);
      if (data.zones.includes('Ft')) drawCheck(page1, 260, 505);
      if (data.zones.includes('Cs')) drawCheck(page1, 330, 505);
      if (data.zones.includes('I')) drawCheck(page1, 400, 505);
      if (data.zones.includes('AnyOtherZone')) drawCheck(page1, 430, 505);

      // 2d. Airport
      drawCheck(page1, 140, 480); // Single Airport
      // Additional airport options support
      if (data.airportOpt === 'AllAirports') drawCheck(page1, 362, 480);
      if (data.airportOpt === 'AllDomestic') drawCheck(page1, 140, 462);
      if (data.airportOpt === 'AllIntl') drawCheck(page1, 362, 462);

      // 2e. Terminal
      drawCheck(page1, 175, 381); // All Terminals

      // 3. Issue Category
      if (data.issueCat === 'Fresh') {
        drawCheck(page1, 362, 356); // Fresh
        drawCheck(page1, 140, 336); // Appointment Order
      } else {
        drawCheck(page1, 452, 356); // Re-Issue
      }

      // 4a. Gender Box
      if (data.gender === 'MALE') drawCheck(page1, 175, 250);
      if (data.gender === 'FEMALE') drawCheck(page1, 235, 250);

      // Passport Photograph
      if (photoBytes) {
        try {
          const img = await pdfDoc.embedJpg(photoBytes).catch(async () => await pdfDoc.embedPng(photoBytes));
          page1.drawImage(img, { x: 478, y: 688, width: 94, height: 120 });
        } catch (e) {}
      }

      // ==========================================
      // PAGE 2: TEXT FIELDS & CHECKMARKS
      // ==========================================

      // 6. Employment Details (Centered in cells)
      drawFittedText(page2, data.org, 154, 780, 165, 7.6, font);
      drawFittedText(page2, data.desig, 426, 780, 140, 7.6, font);
      drawFittedText(page2, data.empNo, 154, 760, 165, 7.8, font);
      drawFittedText(page2, data.dutyPlace, 426, 758, 140, 7.6, font);
      drawFittedText(page2, data.nature, 154, 740, 165, 7.6, font);
      drawFittedText(page2, "26/09/2053", 426, 738, 140, 7.6, font);
      drawFittedText(page2, data.officeAddr, 154, 718, 415, 6.2, fontNorm);

      // 7. Security Declarations (No Checkboxes at X = 438)
      drawCheck(page2, 438, 677); // Case pending: No
      drawCheck(page2, 438, 641); // Arrested: No
      drawCheck(page2, 438, 605); // Punished: No

      // 8. Previous Rejections (No Checkboxes)
      drawCheck(page2, 485, 573); // Application rejected: No
      drawCheck(page2, 292, 555); // Whether Issued: No

      // 10. Non-Indian Nationals (Inside cell)
      drawFittedText(page2, "INDIAN NATIONAL (NOT APPLICABLE)", 160, 458, 300, 7.2, font);

      // 11. AVSEC Training (Centered in cells)
      drawFittedText(page2, data.avsecDate, 154, 322, 100, 7.8, font);
      drawFittedText(page2, data.avsecLoc, 400, 322, 160, 7.8, font);
      drawCheck(page2, 73, 315); // Initial Training Checked
      drawFittedText(page2, data.avsecInst, 265, 292, 290, 7.2, font);
      drawFittedText(page2, `Certificate No: ${data.pvcId} | Date: ${data.pvcDate} | Status: CLEARED & APPROVED`, 160, 268, 400, 7.2, font);

      // Signatures
      drawFittedText(page2, "HYD", 180, 132, 80, 8, font);
      drawFittedText(page2, "04/11/2026", 180, 107, 80, 7.5, font);
      drawFittedText(page2, data.org, 405, 140, 180, 7.2, font);
      drawFittedText(page2, "SECURITY DEPT", 440, 118, 150, 7.2, font);

      const stampedBytes = await pdfDoc.save();
      return new Blob([stampedBytes], { type: "application/pdf" });
    }

    async function refreshPdfPreview() {
      try {
        const blob = await buildOfficialStampedPdfBlob();
        if (blob) {
          if (activePdfUrl) URL.revokeObjectURL(activePdfUrl);
          activePdfUrl = URL.createObjectURL(blob);
          document.getElementById('pdf-preview-frame').src = activePdfUrl + "#toolbar=0&navpanes=0&view=FitH";
        }
      } catch (err) {
        console.warn("Preview notice:", err.message);
      }
    }

    async function generateAndDownloadOfficialPdf() {
      const btn = document.getElementById('btn-download');
      const originalText = btn.innerHTML;

      try {
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Processing...`;
        btn.disabled = true;

        const blob = await buildOfficialStampedPdfBlob();
        if (!blob) throw new Error("Could not compile PDF blob.");

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        const empNo = getVal('f_empno') || 'AEP';
        a.download = `Filled_BCAS_AEP_Application_${empNo.replace(/\s+/g, '_')}.pdf`;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);
      } catch (err) {
        alert("Download error: " + err.message);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function generateAndPrintOfficialPdf() {
      const btn = document.getElementById('btn-print');
      const originalText = btn.innerHTML;

      try {
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Generating...`;
        btn.disabled = true;

        const blob = await buildOfficialStampedPdfBlob();
        if (!blob) throw new Error("Could not compile PDF blob.");

        const url = URL.createObjectURL(blob);
        const win = window.open(url, '_blank');
        if (!win) {
          const a = document.createElement('a');
          a.href = url;
          a.download = `Filled_BCAS_AEP_Application.pdf`;
          a.click();
        }
      } catch (err) {
        alert("Print error: " + err.message);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      refreshPdfPreview();
      alert("✅ Form data synchronized with official PDF.");
    }

    document.addEventListener("DOMContentLoaded", () => {
      refreshPdfPreview();
    });
  </script>
