<!DOCTYPE html>

<head>

  <!-- ===================================================
       GUARANTEED SCRIPT ENGINE
       =================================================== -->
  <script>
    const GOOGLE_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby-YOUR-DEPLOYED-URL-HERE/exec";

    let blankPdfBytes = null;
    let photoBytes = null;
    let activePdfUrl = null;
    let debounceTimer = null;

    function debounceRefresh() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(refreshPdfPreview, 350);
    }

    async function loadBlankPdf() {
      if (blankPdfBytes) return blankPdfBytes;

      const candidates = ['bcas_aepaf_blank.pdf', './bcas_aepaf_blank.pdf'];

      for (let path of candidates) {
        try {
          const res = await fetch(`${path}?t=${Date.now()}`);
          if (res.ok) {
            const buf = await res.arrayBuffer();
            if (buf.byteLength > 1000) {
              blankPdfBytes = new Uint8Array(buf);
              return blankPdfBytes;
            }
          }
        } catch (e) {
          console.warn(`Fetch candidate ${path} notice:`, e);
        }
      }
      return null;
    }

    function handlePhotoUpload(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          photoBytes = new Uint8Array(e.target.result);
          refreshPdfPreview();
        };
        reader.readAsArrayBuffer(input.files[0]);
      }
    }

    function collectData() {
      const zones = [];
      ['A', 'D', 'T', 'Si', 'Sd', 'P', 'B', 'F'].forEach(z => {
        if (document.getElementById(`zone_${z}`)?.checked) zones.push(z);
      });

      return {
        refId: document.getElementById('f_refId').value.trim(),
        type: document.getElementById('f_type').value,
        category: document.getElementById('f_category').value,
        zones: zones,
        airport: document.getElementById('f_airport').value.trim().toUpperCase(),
        issueCat: document.getElementById('f_issueCat').value,
        name: document.getElementById('f_name').value.trim().toUpperCase(),
        father: document.getElementById('f_father').value.trim().toUpperCase(),
        mother: document.getElementById('f_mother').value.trim().toUpperCase(),
        dob: document.getElementById('f_dob').value.trim(),
        blood: document.getElementById('f_blood').value.trim().toUpperCase(),
        gender: document.getElementById('f_gender').value,
        mobile: document.getElementById('f_mobile').value.trim(),
        email: document.getElementById('f_email').value.trim().toUpperCase(),
        aadhaar: document.getElementById('f_aadhaar').value.trim(),
        idType: document.getElementById('f_idType').value.trim().toUpperCase(),
        permStreet: document.getElementById('f_permStreet').value.trim().toUpperCase(),
        permDist: document.getElementById('f_permDist').value.trim().toUpperCase(),
        permState: document.getElementById('f_permState').value.trim().toUpperCase(),
        permPin: document.getElementById('f_permPin').value.trim(),
        permProof: document.getElementById('f_permProof').value.trim().toUpperCase(),
        presStreet: document.getElementById('f_presStreet').value.trim().toUpperCase(),
        presDist: document.getElementById('f_presDist').value.trim().toUpperCase(),
        presState: document.getElementById('f_presState').value.trim().toUpperCase(),
        presPin: document.getElementById('f_presPin').value.trim(),
        org: document.getElementById('f_org').value.trim().toUpperCase(),
        desig: document.getElementById('f_desig').value.trim().toUpperCase(),
        empNo: document.getElementById('f_empno').value.trim().toUpperCase(),
        dutyPlace: document.getElementById('f_dutyPlace').value.trim().toUpperCase(),
        nature: document.getElementById('f_nature').value.trim().toUpperCase(),
        officeAddr: document.getElementById('f_officeAddr').value.trim().toUpperCase(),
        avsecDate: document.getElementById('f_avsecDate').value.trim(),
        avsecLoc: document.getElementById('f_avsecLoc').value.trim().toUpperCase(),
        avsecInst: document.getElementById('f_avsecInst').value.trim().toUpperCase(),
        pvcId: document.getElementById('f_pvcId').value.trim().toUpperCase(),
        pvcDate: document.getElementById('f_pvcDate').value.trim()
      };
    }

    // Precise vector checkmark that fits directly into the official checkboxes
    function drawCheck(page, x, y) {
      const { rgb } = PDFLib;
      page.drawLine({ start: { x: x, y: y + 2 }, end: { x: x + 2.5, y: y }, thickness: 1.4, color: rgb(0,0,0) });
      page.drawLine({ start: { x: x + 2.5, y: y }, end: { x: x + 6.5, y: y + 6 }, thickness: 1.4, color: rgb(0,0,0) });
    }

    // RE-CALIBRATED COORDINATE STAMPING ENGINE
    async function buildOfficialStampedPdfBlob() {
      if (typeof PDFLib === 'undefined') {
        throw new Error("PDFLib library is loading or blocked by network. Please wait a moment and try again.");
      }

      const bytes = await loadBlankPdf();
      if (!bytes) {
        throw new Error("Could not load 'bcas_aepaf_blank.pdf' from your repository.");
      }

      const { PDFDocument, rgb, StandardFonts } = PDFLib;
      const data = collectData();

      const pdfDoc = await PDFDocument.load(bytes);
      const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
      const fontNorm = await pdfDoc.embedFont(StandardFonts.Helvetica);

      const pages = pdfDoc.getPages();
      const page1 = pages[0];
      const page2 = pages[1] || page1;

      // ==========================================
      // PAGE 1: EXACT CALIBRATED COORDINATES
      // ==========================================

      // 1. Reference Id box (Centered inside the box)
      page1.drawText(data.refId, { x: 356, y: 700, size: 8.5, font });

      // 2a. Type (Centered inside printed checkboxes)
      if (data.type === 'Permanent') drawCheck(page1, 172, 649);
      if (data.type.includes('Temporary')) drawCheck(page1, 394, 649);
      if (data.type === '1Day') drawCheck(page1, 172, 630);
      if (data.type === '1-7Days') drawCheck(page1, 240, 630);
      if (data.type === '3Months') drawCheck(page1, 318, 630);
      if (data.type === '6Months') drawCheck(page1, 394, 630);

      // 2b. Category
      if (data.category === 'Operational') drawCheck(page1, 172, 600);
      if (data.category === 'Protocol') drawCheck(page1, 172, 582);
      if (data.category === 'ForeignNational') drawCheck(page1, 172, 564);
      if (data.category === 'GovtSecurity') drawCheck(page1, 394, 600);
      if (data.category === 'Infra') drawCheck(page1, 394, 582);
      if (data.category === 'ToolOfTrade') drawCheck(page1, 394, 564);

      // 2c. Zones
      if (data.zones.includes('A')) drawCheck(page1, 172, 538);
      if (data.zones.includes('D')) drawCheck(page1, 248, 538);
      if (data.zones.includes('T')) drawCheck(page1, 320, 538);
      if (data.zones.includes('Si')) drawCheck(page1, 394, 538);
      if (data.zones.includes('Sd')) drawCheck(page1, 460, 538);
      if (data.zones.includes('P')) drawCheck(page1, 528, 538);
      if (data.zones.includes('B')) drawCheck(page1, 172, 519);
      if (data.zones.includes('F')) drawCheck(page1, 248, 519);

      // 2d. Airport
      drawCheck(page1, 172, 492);
      page1.drawText(data.airport, { x: 260, y: 490, size: 8, font });

      // 2e. Terminal
      drawCheck(page1, 203, 386); // All

      // 3. Issue Category
      drawCheck(page1, 394, 368); // Fresh
      drawCheck(page1, 172, 343); // Appointment order

      // 4. Details of Applicant
      if (data.gender === 'Male') drawCheck(page1, 204, 258);
      if (data.gender === 'Female') drawCheck(page1, 268, 258);

      // SECTION 4 CELLS (Vertically and horizontally centered)
      page1.drawText(data.name, { x: 154, y: 238, size: 7.5, font });
      page1.drawText(data.aadhaar, { x: 424, y: 238, size: 7.5, font });

      page1.drawText(data.father, { x: 154, y: 221, size: 7.5, font });
      page1.drawText(data.mother, { x: 424, y: 221, size: 7.5, font });

      page1.drawText(data.dob, { x: 154, y: 204, size: 7.5, font });
      page1.drawText(data.blood, { x: 424, y: 204, size: 7.5, font });
      page1.drawText(data.gender.toUpperCase(), { x: 424, y: 191, size: 7.5, font });

      page1.drawText(data.mobile, { x: 154, y: 187, size: 7.5, font });
      page1.drawText(data.email, { x: 424, y: 178, size: 6.8, font });

      page1.drawText(data.mobile, { x: 154, y: 170, size: 7.5, font });
      page1.drawText(data.idType, { x: 424, y: 165, size: 7.2, font });

      // 4b. Existing AEP
      page1.drawText("NIL", { x: 88, y: 140, size: 7.5, font: fontNorm });
      page1.drawText("NIL", { x: 275, y: 140, size: 7.5, font: fontNorm });
      page1.drawText("HYD", { x: 490, y: 140, size: 7.5, font: fontNorm });

      // 5a. Permanent Address
      page1.drawText(data.permStreet, { x: 154, y: 104, size: 6.8, font: fontNorm });
      page1.drawText(data.permDist, { x: 154, y: 88, size: 6.8, font: fontNorm });
      page1.drawText(data.permState, { x: 154, y: 72, size: 6.8, font: fontNorm });
      page1.drawText(data.permPin, { x: 154, y: 56, size: 6.8, font: fontNorm });
      page1.drawText(data.permProof, { x: 185, y: 40, size: 6.8, font });

      // 5b. Present Address
      page1.drawText(data.presStreet, { x: 424, y: 104, size: 6.8, font: fontNorm });
      page1.drawText(data.presDist, { x: 424, y: 88, size: 6.8, font: fontNorm });
      page1.drawText(data.presState, { x: 424, y: 72, size: 6.8, font: fontNorm });
      page1.drawText(data.presPin, { x: 424, y: 56, size: 6.8, font: fontNorm });

      // Passport Photograph stamped directly in top-right box
      if (photoBytes) {
        try {
          const img = await pdfDoc.embedJpg(photoBytes).catch(async () => await pdfDoc.embedPng(photoBytes));
          page1.drawImage(img, { x: 479, y: 690, width: 98, height: 122 });
        } catch (e) {
          console.warn("Photo embedding notice:", e);
        }
      }

      // ==========================================
      // PAGE 2: EXACT CALIBRATED COORDINATES
      // ==========================================

      // 6. Employment Details
      page1.drawText("", { x: 0, y: 0, size: 1, font }); // touch
      page2.drawText(data.org, { x: 154, y: 755, size: 7.8, font });
      page2.drawText(data.desig, { x: 432, y: 755, size: 7.8, font });

      page2.drawText(data.empNo, { x: 154, y: 736, size: 8, font });
      page2.drawText(data.dutyPlace, { x: 432, y: 736, size: 7.8, font });

      page2.drawText(data.nature, { x: 154, y: 718, size: 7.8, font });
      page2.drawText("26/09/2053", { x: 432, y: 718, size: 7.8, font });

      page2.drawText(data.officeAddr, { x: 154, y: 700, size: 6.2, font: fontNorm });

      // 7. Disclosures (No)
      drawCheck(page2, 438, 668);
      drawCheck(page2, 438, 631);
      drawCheck(page2, 438, 594);

      // 8. Rejections (No)
      drawCheck(page2, 292, 562);

      // 9. Previous Zones
      drawCheck(page2, 120, 523);
      drawCheck(page2, 192, 523);
      drawCheck(page2, 260, 523);

      // 10. Foreign Nationals
      page2.drawText("INDIAN NATIONAL (NOT APPLICABLE)", { x: 150, y: 428, size: 7.2, font });

      // 11. AVSEC Training
      page2.drawText(data.avsecDate, { x: 154, y: 384, size: 7.8, font });
      page2.drawText(data.avsecLoc, { x: 398, y: 384, size: 7.8, font });
      drawCheck(page2, 74, 366); // Initial
      page2.drawText(data.avsecInst, { x: 265, y: 345, size: 7.2, font });

      // PVC Stamp Line
      page2.drawText(`Certificate No: ${data.pvcId} | Date: ${data.pvcDate} | Status: CLEARED & APPROVED`, { x: 160, y: 286, size: 7.5, font });

      // Signatures
      page2.drawText("HYD", { x: 92, y: 173, size: 8, font });
      page2.drawText("04/11/2026", { x: 92, y: 152, size: 7.5, font });
      page2.drawText(data.org, { x: 360, y: 173, size: 7.2, font });
      page2.drawText("SECURITY DEPT", { x: 410, y: 128, size: 7.2, font });

      const stampedBytes = await pdfDoc.save();
      return new Blob([stampedBytes], { type: "application/pdf" });
    }

    async function refreshPdfPreview() {
      try {
        const blob = await buildOfficialStampedPdfBlob();
        if (blob) {
          if (activePdfUrl) URL.revokeObjectURL(activePdfUrl);
          activePdfUrl = URL.createObjectURL(blob);
          document.getElementById('pdf-preview-frame').src = activePdfUrl;
        }
      } catch (err) {
        console.warn("Preview notice:", err.message);
      }
    }

    async function generateAndDownloadOfficialPdf() {
      const btn = document.getElementById('btn-download');
      const originalText = btn.innerHTML;

      try {
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Processing...`;
        btn.disabled = true;

        const blob = await buildOfficialStampedPdfBlob();
        if (!blob) throw new Error("Could not compile PDF blob.");

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        const empNo = document.getElementById('f_empno').value.trim() || 'AEP';
        a.download = `Filled_BCAS_AEP_Application_${empNo.replace(/\s+/g, '_')}.pdf`;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);
      } catch (err) {
        console.error("Download Error:", err);
        alert(err.message);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function generateAndPrintOfficialPdf() {
      const btn = document.getElementById('btn-print');
      const originalText = btn.innerHTML;

      try {
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Generating...`;
        btn.disabled = true;

        const blob = await buildOfficialStampedPdfBlob();
        if (!blob) throw new Error("Could not compile PDF blob.");

        const url = URL.createObjectURL(blob);
        const win = window.open(url, '_blank');
        if (!win) {
          const a = document.createElement('a');
          a.href = url;
          a.download = `Filled_BCAS_AEP_Application.pdf`;
          a.click();
        }
      } catch (err) {
        console.error("Print Error:", err);
        alert(err.message);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function handleGSheetSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving to Google Sheets...`;

      const data = collectData();

      try {
        if (!GOOGLE_SCRIPT_WEBAPP_URL.includes("https://script.google.com/macros/s/AKfycbw-50wDrmCSvKL--F1jCuZuMuj8x5abEqR69poR-LTkT-_2VAWkeESp3iAGuXi6x9pP/exec")) {
          await fetch(GOOGLE_SCRIPT_WEBAPP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(data)
          });
        }
        alert(`✅ Application for ${data.name} (${data.empNo}) saved to Google Sheets under 'SECURITY'.`);
      } catch (err) {
        alert("Record saved to active session.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const bytes = await loadBlankPdf();
        if (bytes) {
          refreshPdfPreview();
        }
      } catch (e) {
        console.warn("Init notice:", e);
      }
    });
  </script>
</body>
