<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AEP Official Portal | BCAS Form Engine</title>

  <meta name="theme-color" content="#f5f5f7" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- PDF-Lib Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
    }
    .apple-glass-nav {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .apple-card {
      background: #ffffff;
      border: 1px solid rgba(210, 210, 215, 0.6);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      border-radius: 16px;
    }
    .apple-input {
      background: #fbfbfd;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
    }
    .apple-input:focus {
      outline: none;
      background: #ffffff;
      border-color: #0071e3;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    }
    .pdf-preview-frame {
      width: 100%;
      height: 840px;
      border-radius: 16px;
      border: 1px solid #d2d2d7;
      background: #525659;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- Navigation Bar -->
  <header class="fixed top-0 left-0 right-0 h-16 apple-glass-nav border-b border-[#d2d2d7]/60 z-50">

      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-[#0071e3] flex items-center justify-center text-white shadow-xs">
          <i class="fa-solid fa-file-pdf text-sm"></i>
        </div>
        <div>
          <span class="text-base font-semibold tracking-tight block leading-tight">BCAS AEP Form Engine</span>
          <span class="text-[10px] text-[#86868b] tracking-wider uppercase font-semibold">Precision Calibrated Form Mapper</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-2">
        <button type="button" onclick="generateAndPrintOfficialPdf()" id="btn-print" class="px-5 py-2.5 bg-[#1d1d1f] hover:bg-black active:scale-[0.98] text-white text-xs font-bold rounded-xl shadow-md transition-all flex items-center space-x-1.5 cursor-pointer">
          <i class="fa-solid fa-print"></i>
          <span>Print Filled PDF</span>
        </button>

        <button type="button" onclick="generateAndDownloadOfficialPdf()" id="btn-download" class="px-5 py-2.5 bg-[#0071e3] hover:bg-[#0077ed] active:scale-[0.98] text-white text-xs font-bold rounded-xl shadow-xs transition-all flex items-center space-x-1.5 cursor-pointer">
          <i class="fa-solid fa-download"></i>
          <span>Download Filled PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->

            </div>

            <div>

              <input type="text" id="f_refId" required value="HYD/2026/AEP/72835" oninput="debounceRefresh()" class="w-full p-2.5 apple-input text-xs font-bold uppercase" />
            </div>

            <div class="grid grid-cols-2 gap-3 text-xs">

  <script>
    let blankPdfBytes = null;
    let photoBytes = null;
    let activePdfUrl = null;
    let debounceTimer = null;

    function getVal(id) {
      const el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }

    function isChecked(id) {
      const el = document.getElementById(id);
      return el ? el.checked : false;
    }

    function debounceRefresh() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(refreshPdfPreview, 250);
    }

    async function loadBlankPdf() {
      if (blankPdfBytes) return blankPdfBytes;

      const candidates = [
        'bcas_aepaf_blank.pdf',
        './bcas_aepaf_blank.pdf',
        'bcas_aepaf_fillable.pdf',
        './bcas_aepaf_fillable.pdf'
      ];

      for (let path of candidates) {
        try {
          const res = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });
          if (res.ok) {
            const buf = await res.arrayBuffer();
            if (buf.byteLength > 1000) {
              blankPdfBytes = new Uint8Array(buf);
              return blankPdfBytes;
            }
          }
        } catch (e) {}
      }
      return null;
    }

    function handlePhotoUpload(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          photoBytes = new Uint8Array(e.target.result);
          refreshPdfPreview();
        };
        reader.readAsArrayBuffer(input.files[0]);
      }
    }

    function collectData() {
      const zones = [];
      ['A', 'D', 'T', 'Si', 'Sd', 'P', 'B', 'F'].forEach(z => {
        if (isChecked(`zone_${z}`)) zones.push(z);
      });

      return {
        refId: getVal('f_refId'),
        type: getVal('f_type'),
        category: getVal('f_category'),
        zones: zones,
        airport: getVal('f_airport').toUpperCase(),
        issueCat: getVal('f_issueCat'),
        name: getVal('f_name').toUpperCase(),
        father: getVal('f_father').toUpperCase(),
        mother: getVal('f_mother').toUpperCase(),
        dob: getVal('f_dob'),
        blood: getVal('f_blood').toUpperCase(),
        gender: getVal('f_gender').toUpperCase(),
        mobile: getVal('f_mobile'),
        email: getVal('f_email').toUpperCase(),
        kin: getVal('f_kin'),
        aadhaar: getVal('f_aadhaar'),
        idType: getVal('f_idType').toUpperCase(),
        permStreet: getVal('f_permStreet').toUpperCase(),
        permDist: getVal('f_permDist').toUpperCase(),
        permState: getVal('f_permState').toUpperCase(),

    }

    // Dynamic text fitter: shrinks font so text never overlaps cell borders
    function drawFittedText(page, text, x, y, maxW, baseSize, font) {
      if (!text) return;
      let str = String(text).trim();
      let size = baseSize;
      let textW = font.widthOfTextAtSize(str, size);
      while (textW > maxW && size > 4.5) {
        size -= 0.4;
        textW = font.widthOfTextAtSize(str, size);
      }
      if (textW > maxW) {
        while (font.widthOfTextAtSize(str + '...', size) > maxW && str.length > 3) {
          str = str.slice(0, -1);
        }
        str += '...';
      }
      page.drawText(str, { x, y, size, font });
    }

    function getWidgetPageIndex(widget, pdfDoc) {
      try {
        const pages = pdfDoc.getPages();
        const pRef = widget.P();
        if (pRef) {
          for (let i = 0; i < pages.length; i++) {
            if (pages[i].ref === pRef) return i;
          }
        }
        for (let i = 0; i < pages.length; i++) {
          const annots = pages[i].node.Annots();
          if (annots) {
            const arr = annots.asArray();
            for (let a of arr) {
              if (a === widget.dict || (a.toString && widget.dict.toString && a.toString() === widget.dict.toString())) {
                return i;
              }
            }
          }
        }
      } catch (e) {}
      return 0;
    }

    async function buildOfficialStampedPdfBlob() {
      if (typeof PDFLib === 'undefined') {
        throw new Error("PDFLib library is loading.");
      }

      const bytes = await loadBlankPdf();
      if (!bytes) {
        throw new Error("Could not find 'bcas_aepaf_blank.pdf' in your repository.");
      }

      const { PDFDocument, StandardFonts } = PDFLib;
      const data = collectData();

      const pdfDoc = await PDFDocument.load(bytes);
      const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
      const fontNorm = await pdfDoc.embedFont(StandardFonts.Helvetica);

      const form = pdfDoc.getForm();
      const fields = form.getFields();
      const filledKeys = new Set();

      // Stage 1: Try filling interactive PDFescape fields if present
      if (fields && fields.length > 0) {
        for (const field of fields) {
          const fieldType = field.constructor.name;
          const name = field.getName().toLowerCase();
          const widgets = field.acroField.getWidgets();
          if (!widgets || widgets.length === 0) continue;

          const rect = widgets[0].getRectangle();
          const pIndex = getWidgetPageIndex(widgets[0], pdfDoc);
          const x = rect.x;
          const y = rect.y;

          if (fieldType.includes('Text')) {
            let valToSet = null;
            let key = null;

            // Name-based matching
            if (name.includes('ref')) { valToSet = data.refId; key = 'refId'; }
            else if (name.includes('name') && !name.includes('father') && !name.includes('mother')) { valToSet = data.name; key = 'name'; }
            else if (name.includes('father')) { valToSet = data.father; key = 'father'; }
            else if (name.includes('mother')) { valToSet = data.mother; key = 'mother'; }
            else if (name.includes('dob') || name.includes('birth')) { valToSet = data.dob; key = 'dob'; }
            else if (name.includes('blood')) { valToSet = data.blood; key = 'blood'; }
            else if (name.includes('gender')) { valToSet = data.gender; key = 'gender'; }
            else if (name.includes('mobile') && !name.includes('kin')) { valToSet = data.mobile; key = 'mobile'; }
            else if (name.includes('mail')) { valToSet = data.email; key = 'email'; }
            else if (name.includes('kin')) { valToSet = data.kin; key = 'kin'; }
            else if (name.includes('aadhaar') || name.includes('aadhar')) { valToSet = data.aadhaar; key = 'aadhaar'; }
            else if (name.includes('idtype') || name.includes('proof')) { valToSet = data.idType; key = 'idType'; }
            else if (name.includes('org')) { valToSet = data.org; key = 'org'; }
            else if (name.includes('desig')) { valToSet = data.desig; key = 'desig'; }
            else if (name.includes('emp')) { valToSet = data.empNo; key = 'empNo'; }
            else if (name.includes('duty') || name.includes('place')) { valToSet = data.dutyPlace; key = 'dutyPlace'; }
            else if (name.includes('nature')) { valToSet = data.nature; key = 'nature'; }
            else if (name.includes('office') || name.includes('addr')) { valToSet = data.officeAddr; key = 'officeAddr'; }
            else if (name.includes('avsec') && name.includes('date')) { valToSet = data.avsecDate; key = 'avsecDate'; }
            else if (name.includes('loc')) { valToSet = data.avsecLoc; key = 'avsecLoc'; }
            else if (name.includes('inst')) { valToSet = data.avsecInst; key = 'avsecInst'; }

            // Precise Spatial matching using calibrated box locations
            if (!valToSet) {
              if (pIndex === 0) {
                if (y > 675 && y < 710 && x > 180) { valToSet = data.refId; key = 'refId'; }
                else if (y > 475 && y < 510 && x > 250) { valToSet = data.airport; key = 'airport'; }
                // Section 4a: Applicant Details
                else if (y > 230 && y <= 252 && x < 360) { valToSet = data.name; key = 'name'; }
                else if (y > 230 && y <= 252 && x >= 360) { valToSet = data.aadhaar; key = 'aadhaar'; }
                else if (y > 212 && y <= 230 && x < 360) { valToSet = data.father; key = 'father'; }
                else if (y > 212 && y <= 230 && x >= 360) { valToSet = data.mother; key = 'mother'; }
                else if (y > 195 && y <= 212 && x < 360) { valToSet = data.dob; key = 'dob'; }
                else if (y > 195 && y <= 212 && x >= 360) { valToSet = data.blood; key = 'blood'; }
                else if (y > 178 && y <= 195 && x < 360) { valToSet = data.mobile; key = 'mobile'; }
                else if (y > 178 && y <= 195 && x >= 360) { valToSet = data.gender; key = 'gender'; }
                else if (y > 160 && y <= 178 && x < 360) { valToSet = data.kin; key = 'kin'; }
                else if (y > 160 && y <= 178 && x >= 360) { valToSet = data.email; key = 'email'; }
                else if (y > 142 && y <= 160 && x >= 360) { valToSet = data.idType; key = 'idType'; }
                // Section 4b: Existing AEP
                else if (y > 118 && y <= 138 && x < 180) { valToSet = "NIL"; key = 'aepNo'; }
                else if (y > 118 && y <= 138 && x >= 180 && x < 380) { valToSet = "NIL"; key = 'aepValid'; }
                else if (y > 118 && y <= 138 && x >= 380) { valToSet = "HYD"; key = 'aepPlace'; }
                // Section 5: Residential Address
                else if (y > 94 && y <= 112 && x < 360) { valToSet = data.permStreet; key = 'permStreet'; }
                else if (y > 94 && y <= 112 && x >= 360) { valToSet = data.presStreet; key = 'presStreet'; }
                else if (y > 78 && y <= 94 && x < 360) { valToSet = data.permDist; key = 'permDist'; }
                else if (y > 78 && y <= 94 && x >= 360) { valToSet = data.presDist; key = 'presDist'; }
                else if (y > 62 && y <= 78 && x < 360) { valToSet = data.permState; key = 'permState'; }
                else if (y > 62 && y <= 78 && x >= 360) { valToSet = data.presState; key = 'presState'; }
                else if (y > 46 && y <= 62 && x < 360) { valToSet = data.permPin; key = 'permPin'; }
                else if (y > 46 && y <= 62 && x >= 360) { valToSet = data.presPin; key = 'presPin'; }
                else if (y > 25 && y <= 46 && x < 380) { valToSet = data.permProof; key = 'permProof'; }
              } else {
                // Page 2
                if (y > 766 && y <= 790 && x < 360) { valToSet = data.org; key = 'org'; }
                else if (y > 766 && y <= 790 && x >= 360) { valToSet = data.desig; key = 'desig'; }
                else if (y > 748 && y <= 766 && x < 360) { valToSet = data.empNo; key = 'empNo'; }
                else if (y > 748 && y <= 766 && x >= 360) { valToSet = data.dutyPlace; key = 'dutyPlace'; }
                else if (y > 730 && y <= 748 && x < 360) { valToSet = data.nature; key = 'nature'; }
                else if (y > 730 && y <= 748 && x >= 360) { valToSet = "26/09/2053"; key = 'retirement'; }
                else if (y > 705 && y <= 730) { valToSet = data.officeAddr; key = 'officeAddr'; }
                else if (y > 335 && y <= 358 && x < 300) { valToSet = data.avsecDate; key = 'avsecDate'; }
                else if (y > 335 && y <= 358 && x >= 300) { valToSet = data.avsecLoc; key = 'avsecLoc'; }
                else if (y > 300 && y <= 325) { valToSet = data.avsecInst; key = 'avsecInst'; }
                else if (y > 132 && y <= 152 && x < 300) { valToSet = "HYD"; key = 'place'; }
                else if (y > 132 && y <= 152 && x >= 300) { valToSet = data.org; key = 'signName'; }
                else if (y > 110 && y <= 132 && x < 300) { valToSet = "04/11/2026"; key = 'date'; }
                else if (y > 110 && y <= 132 && x >= 300) { valToSet = "SECURITY DEPT"; key = 'signDesig'; }
              }
            }

            if (valToSet !== null) {
              try {
                field.setText(String(valToSet));
                if (key) filledKeys.add(key);
              } catch (e) {}
            }
          }
        }
      }

      // Stage 2: Precision Direct Fill inside every bordered box
      const pages = pdfDoc.getPages();
      const page1 = pages[0];
      const page2 = pages[1] || page1;

      // --- PAGE 1 EXACT BOX FILL ---
      // 1. Reference ID
      if (!filledKeys.has('refId')) {
        drawFittedText(page1, data.refId, 218, 693, 200, 8.5, font);
      }
      // 2d. Airport
      if (!filledKeys.has('airport')) {
        drawFittedText(page1, data.airport, 280, 494, 90, 7.8, font);
      }

      // 4a. Applicant Details Table (Verified inside cell boxes)
      if (!filledKeys.has('name')) {
        drawFittedText(page1, data.name, 146, 242, 200, 7.5, font);
      }
      if (!filledKeys.has('aadhaar')) {
        drawFittedText(page1, data.aadhaar, 418, 242, 150, 7.5, font);
      }
      if (!filledKeys.has('father')) {
        drawFittedText(page1, data.father, 146, 224, 200, 7.5, font);
      }
      if (!filledKeys.has('mother')) {
        drawFittedText(page1, data.mother, 418, 224, 150, 7.5, font);
      }
      if (!filledKeys.has('dob')) {
        drawFittedText(page1, data.dob, 146, 206, 120, 7.5, font);
      }
      if (!filledKeys.has('blood')) {
        drawFittedText(page1, data.blood, 418, 206, 150, 7.5, font);
      }
      if (!filledKeys.has('mobile')) {
        drawFittedText(page1, data.mobile, 146, 188, 120, 7.5, font);
      }
      if (!filledKeys.has('gender')) {
        drawFittedText(page1, data.gender, 418, 188, 150, 7.5, font);
      }
      if (!filledKeys.has('kin')) {
        drawFittedText(page1, data.kin, 146, 170, 120, 7.5, font);
      }
      if (!filledKeys.has('email')) {
        drawFittedText(page1, data.email, 418, 170, 150, 6.8, font);
      }
      if (!filledKeys.has('idType')) {
        drawFittedText(page1, data.idType, 418, 152, 150, 7.2, font);
      }

      // 4b. Existing AEP Details
      if (!filledKeys.has('aepNo')) {
        drawFittedText(page1, "NIL", 76, 128, 110, 7.5, fontNorm);
      }
      if (!filledKeys.has('aepValid')) {
        drawFittedText(page1, "NIL", 272, 128, 110, 7.5, fontNorm);
      }
      if (!filledKeys.has('aepPlace')) {
        drawFittedText(page1, "HYD", 492, 128, 75, 7.5, fontNorm);
      }

      // 5. Residential Address: Permanent (Left) & Present (Right)
      if (!filledKeys.has('permStreet')) {
        drawFittedText(page1, data.permStreet, 146, 102, 160, 6.8, fontNorm);
      }
      if (!filledKeys.has('permDist')) {
        drawFittedText(page1, data.permDist, 146, 86, 160, 6.8, fontNorm);
      }
      if (!filledKeys.has('permState')) {
        drawFittedText(page1, data.permState, 146, 70, 160, 6.8, fontNorm);
      }
      if (!filledKeys.has('permPin')) {
        drawFittedText(page1, data.permPin, 146, 54, 160, 6.8, fontNorm);
      }
      if (!filledKeys.has('permProof')) {
        drawFittedText(page1, data.permProof, 184, 35, 160, 7.0, font);
      }

      if (!filledKeys.has('presStreet')) {
        drawFittedText(page1, data.presStreet, 422, 102, 150, 6.8, fontNorm);
      }
      if (!filledKeys.has('presDist')) {
        drawFittedText(page1, data.presDist, 422, 86, 150, 6.8, fontNorm);
      }
      if (!filledKeys.has('presState')) {
        drawFittedText(page1, data.presState, 422, 70, 150, 6.8, fontNorm);
      }
      if (!filledKeys.has('presPin')) {
        drawFittedText(page1, data.presPin, 422, 54, 150, 6.8, fontNorm);
      }

      // --- PAGE 2 EXACT BOX FILL ---
      // 6. Employment Details
      if (!filledKeys.has('org')) {
        drawFittedText(page2, data.org, 146, 776, 165, 7.6, font);
      }
      if (!filledKeys.has('desig')) {
        drawFittedText(page2, data.desig, 422, 776, 150, 7.6, font);
      }
      if (!filledKeys.has('empNo')) {
        drawFittedText(page2, data.empNo, 146, 758, 165, 7.8, font);
      }
      if (!filledKeys.has('dutyPlace')) {
        drawFittedText(page2, data.dutyPlace, 422, 758, 150, 7.6, font);
      }
      if (!filledKeys.has('nature')) {
        drawFittedText(page2, data.nature, 146, 740, 165, 7.6, font);
      }
      if (!filledKeys.has('retirement')) {
        drawFittedText(page2, "26/09/2053", 422, 740, 150, 7.6, font);
      }
      if (!filledKeys.has('officeAddr')) {
        drawFittedText(page2, data.officeAddr, 146, 718, 425, 6.2, fontNorm);
      }

      // 10. Non-Indian Nationals
      drawFittedText(page2, "INDIAN NATIONAL (NOT APPLICABLE)", 160, 468, 300, 7.2, font);

      // 11. AVSEC Training
      if (!filledKeys.has('avsecDate')) {
        drawFittedText(page2, data.avsecDate, 146, 345, 100, 7.8, font);
      }
      if (!filledKeys.has('avsecLoc')) {
        drawFittedText(page2, data.avsecLoc, 395, 345, 160, 7.8, font);
      }
      if (!filledKeys.has('avsecInst')) {
        drawFittedText(page2, data.avsecInst, 265, 312, 290, 7.2, font);
      }

      drawFittedText(page2, `Certificate No: ${data.pvcId} | Date: ${data.pvcDate} | Status: CLEARED & APPROVED`, 160, 280, 400, 7.2, font);

      // Signatures
      if (!filledKeys.has('place')) {
        drawFittedText(page2, "HYD", 110, 142, 130, 8, font);
      }
      if (!filledKeys.has('date')) {
        drawFittedText(page2, "04/11/2026", 110, 120, 130, 7.5, font);
      }
      if (!filledKeys.has('signName')) {
        drawFittedText(page2, data.org, 390, 142, 180, 7.2, font);
      }
      if (!filledKeys.has('signDesig')) {
        drawFittedText(page2, "SECURITY DEPT", 420, 120, 150, 7.2, font);
      }

      // Passport Photograph
      if (photoBytes) {
        try {
          const img = await pdfDoc.embedJpg(photoBytes).catch(async () => await pdfDoc.embedPng(photoBytes));
          page1.drawImage(img, { x: 478, y: 688, width: 94, height: 120 });
        } catch (e) {}
      }

      try {
        form.flatten();
      } catch (e) {}

      const stampedBytes = await pdfDoc.save();
      return new Blob([stampedBytes], { type: "application/pdf" });
    }

    async function refreshPdfPreview() {
      try {
        const blob = await buildOfficialStampedPdfBlob();
        if (blob) {
          if (activePdfUrl) URL.revokeObjectURL(activePdfUrl);
          activePdfUrl = URL.createObjectURL(blob);
          document.getElementById('pdf-preview-frame').src = activePdfUrl;
        }
      } catch (err) {
        console.warn("Preview notice:", err.message);
      }
    }

    async function generateAndDownloadOfficialPdf() {
      const btn = document.getElementById('btn-download');
      const originalText = btn.innerHTML;

      try {
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Processing...`;
        btn.disabled = true;

        const blob = await buildOfficialStampedPdfBlob();
        if (!blob) throw new Error("Could not compile PDF blob.");

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        const empNo = getVal('f_empno') || 'AEP';
        a.download = `Filled_BCAS_AEP_Application_${empNo.replace(/\s+/g, '_')}.pdf`;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);
      } catch (err) {
        alert("Download error: " + err.message);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function generateAndPrintOfficialPdf() {
      const btn = document.getElementById('btn-print');
      const originalText = btn.innerHTML;

      try {
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Generating...`;
        btn.disabled = true;

        const blob = await buildOfficialStampedPdfBlob();
        if (!blob) throw new Error("Could not compile PDF blob.");

        const url = URL.createObjectURL(blob);
        const win = window.open(url, '_blank');
        if (!win) {
          const a = document.createElement('a');
          a.href = url;
          a.download = `Filled_BCAS_AEP_Application.pdf`;
          a.click();
        }
      } catch (err) {
        alert("Print error: " + err.message);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      refreshPdfPreview();
      alert("✅ Form data synchronized with official PDF.");
    }

    document.addEventListener("DOMContentLoaded", () => {
      refreshPdfPreview();
    });
  </script>
