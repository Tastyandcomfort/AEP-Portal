<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AEP Official Portal | BCAS Form Engine</title>

  <meta name="theme-color" content="#f5f5f7" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- PDF-Lib Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
    }
    .apple-glass-nav {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .apple-card {
      background: #ffffff;
      border: 1px solid rgba(210, 210, 215, 0.6);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      border-radius: 16px;
    }
    .apple-input {
      background: #fbfbfd;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
    }
    .apple-input:focus {
      outline: none;
      background: #ffffff;
      border-color: #0071e3;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    }
    .pdf-preview-frame {
      width: 100%;
      height: 840px;
      border-radius: 16px;
      border: 1px solid #d2d2d7;
      background: #525659;
    }
  </style>
</head>

      </div>

  <script>
    // Paste your Google Apps Script WebApp URL if you want Google Sheets integration
    const GOOGLE_SCRIPT_WEBAPP_URL = "";

    let blankPdfBytes = null;
    let photoBytes = null;
    let activePdfUrl = null;
    let debounceTimer = null;

    function getVal(id) {
      const el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }

    function isChecked(id) {
      const el = document.getElementById(id);
      return el ? el.checked : false;
    }

    function debounceRefresh() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(refreshPdfPreview, 300);
    }

    async function loadBlankPdf() {
      if (blankPdfBytes) return blankPdfBytes;

      const candidates = [
        'bcas_aepaf_blank.pdf',
        './bcas_aepaf_blank.pdf',
        'bcas_aepaf_fillable.pdf',
        './bcas_aepaf_fillable.pdf'
      ];

      for (let path of candidates) {
        try {
          const res = await fetch(`${path}?t=${Date.now()}`);
          if (res.ok) {
            const buf = await res.arrayBuffer();
            if (buf.byteLength > 1000) {
              blankPdfBytes = new Uint8Array(buf);
              return blankPdfBytes;
            }
          }
        } catch (e) {}
      }
      return null;
    }

    function handlePhotoUpload(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          photoBytes = new Uint8Array(e.target.result);
          refreshPdfPreview();
        };
        reader.readAsArrayBuffer(input.files[0]);
      }
    }

    function collectData() {
      const zones = [];
      ['A', 'D', 'T', 'Si', 'Sd', 'P', 'B', 'F'].forEach(z => {
        if (isChecked(`zone_${z}`)) zones.push(z);
      });

      return {
        refId: getVal('f_refId'),
        type: getVal('f_type'),
        category: getVal('f_category'),
        zones: zones,
        airport: getVal('f_airport').toUpperCase(),
        issueCat: getVal('f_issueCat'),
        name: getVal('f_name').toUpperCase(),
        father: getVal('f_father').toUpperCase(),
        mother: getVal('f_mother').toUpperCase(),
        dob: getVal('f_dob'),
        blood: getVal('f_blood').toUpperCase(),
        gender: getVal('f_gender'),
        mobile: getVal('f_mobile'),
        email: getVal('f_email').toUpperCase(),
        kin: getVal('f_kin'),
        aadhaar: getVal('f_aadhaar'),
        idType: getVal('f_idType').toUpperCase(),
        permStreet: getVal('f_permStreet').toUpperCase(),

    async function buildOfficialStampedPdfBlob() {

      let bytes = await loadBlankPdf();
      let isFallbackGenerated = false;

      // Fallback: If no template PDF uploaded to repo, dynamically create the template
      if (!bytes) {
        bytes = await createBlankBaseDoc();
        isFallbackGenerated = true;
      }

      const { PDFDocument, StandardFonts } = PDFLib;
      const data = collectData();

        page2.drawText(data.empNo, { x: 110, y: 750, size: 8, font });

        page2.drawText(data.org, { x: 360, y: 165, size: 7.2, font });

      }

      // Passport Photograph
      if (photoBytes) {
        try {
          const img = await pdfDoc.embedJpg(photoBytes).catch(async () => await pdfDoc.embedPng(photoBytes));
          page1.drawImage(img, { x: 477, y: 686, width: 93, height: 113 });

    async function refreshPdfPreview() {
      try {
        const blob = await buildOfficialStampedPdfBlob();
        if (blob) {
          if (activePdfUrl) URL.revokeObjectURL(activePdfUrl);
          activePdfUrl = URL.createObjectURL(blob);
          document.getElementById('pdf-preview-frame').src = activePdfUrl;
        }
      } catch (err) {
        console.error("Preview notice:", err);
      }
    }

    async function generateAndDownloadOfficialPdf() {
      const btn = document.getElementById('btn-download');
      const originalText = btn.innerHTML;

      try {
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Processing...`;
        btn.disabled = true;

        const blob = await buildOfficialStampedPdfBlob();
        if (!blob) throw new Error("Could not compile PDF blob.");

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        const empNo = getVal('f_empno') || 'AEP';
        a.download = `Filled_BCAS_AEP_Application_${empNo.replace(/\s+/g, '_')}.pdf`;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);
      } catch (err) {
        alert("Download error: " + err.message);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function generateAndPrintOfficialPdf() {
      const btn = document.getElementById('btn-print');
      const originalText = btn.innerHTML;

      try {
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Generating...`;
        btn.disabled = true;

        const blob = await buildOfficialStampedPdfBlob();
        if (!blob) throw new Error("Could not compile PDF blob.");

        const url = URL.createObjectURL(blob);
        const win = window.open(url, '_blank');
        if (!win) {
          const a = document.createElement('a');
          a.href = url;
          a.download = `Filled_BCAS_AEP_Application.pdf`;
          a.click();
        }
      } catch (err) {
        alert("Print error: " + err.message);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function handleGSheetSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving Record...`;

      const data = collectData();

      try {
        if (GOOGLE_SCRIPT_WEBAPP_URL && GOOGLE_SCRIPT_WEBAPP_URL.startsWith("https://script.google.com")) {
          await fetch(GOOGLE_SCRIPT_WEBAPP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
          });
        }
        alert(`✅ Application record for ${data.name} (${data.empNo}) processed successfully.`);
      } catch (err) {
        alert("Record saved to active session.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      refreshPdfPreview();
    });
  </script>
